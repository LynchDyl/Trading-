name: Weekly wealth-builder allocation

# Monday pre-open (12:00 UTC): where this week's £50 goes.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  allocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Refresh market data
        run: python scripts/fetch_data.py

      - name: Compute allocation
        run: |
          python scripts/run_portfolio_signals.py
          cat signals/portfolio_latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data + signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ signals/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly allocation $(date -u +%F)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
