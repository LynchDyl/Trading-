name: Daily trading signals

on:
  schedule:
    # 21:30 UTC — after the US close (both EST and EDT), Mon-Fri
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Fetch latest market data
        run: python scripts/fetch_data.py

      - name: Generate signals
        run: |
          python scripts/run_signals.py
          cat signals/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data + signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ signals/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily signals $(date -u +%F)"
            git push
          fi
